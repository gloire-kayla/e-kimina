function seed(){return {version:1,settings:{name:'Twitezimbere',contribution:10000,frequency:'monthly',rate:2,term:6,goal:5000000},members:[{id:'m1',name:'Aline Uwase',phone:'0780 000 001',role:'treasurer'},{id:'m2',name:'Eric Mugisha',phone:'0780 000 002',role:'member'},{id:'m3',name:'Diane Ingabire',phone:'0780 000 003',role:'member'},{id:'m4',name:'Jean Niyonzima',phone:'0780 000 004',role:'chairperson'},{id:'m5',name:'Grace Mukamana',phone:'0780 000 005',role:'secretary'},{id:'m6',name:'Patrick Habimana',phone:'0780 000 006',role:'member'},{id:'m7',name:'Claudine Keza',phone:'0780 000 007',role:'member'},{id:'m8',name:'Samuel Ishimwe',phone:'0780 000 008',role:'member'}],payments:[{id:'p1',member:'m2',amount:10000,date:today(),method:'momo',purpose:'contribution',reference:'DEMO-1041',status:'pending',period:today().slice(0,7)},{id:'p2',member:'m3',amount:10000,date:today(),method:'cash',purpose:'contribution',reference:'',status:'pending',period:today().slice(0,7)},{id:'p3',member:'m6',amount:20000,date:today(),method:'bank',purpose:'contribution',reference:'DEMO-1043',status:'pending',period:today().slice(0,7)}],loans:[{id:'l1',member:'m2',amount:180000,purpose:'Business stock',term:6,rate:2,status:'active',disbursedAt:today(),paid:0},{id:'l2',member:'m3',amount:100000,purpose:'School fees',term:4,rate:2,status:'submitted',paid:0}],ledger:[{id:'opening',date:today(),kind:'opening',amount:2960000,member:null,detail:'Demo opening savings balance'},{id:'opening-loan',date:today(),kind:'disbursement',amount:180000,member:'m2',loan:'l1',detail:'Demo loan disbursement'}],audit:[]};}
function money(n){if(!Number.isSafeInteger(n)||n<=0||n>1000000000)throw Error('invalidAmount');return n;}
function loanTotals(l){const interest=Math.round(l.amount*l.rate*l.term/100);return {principal:l.amount,interest,total:l.amount+interest,outstanding:l.amount+interest-(l.paid||0)};}
function totals(s){const contributions=s.ledger.filter(e=>e.kind==='contribution'||e.kind==='opening').reduce((a,e)=>a+e.amount,0);const out=s.ledger.filter(e=>e.kind==='disbursement').reduce((a,e)=>a+e.amount,0);const repayments=s.ledger.filter(e=>e.kind==='repayment').reduce((a,e)=>a+e.amount,0);return {savings:contributions,cash:contributions-out+repayments,loans:s.loans.filter(l=>l.status==='active').reduce((a,l)=>a+loanTotals(l).outstanding,0),pending:s.payments.filter(p=>p.status==='pending').length};}
function audit(s,actor,action,detail){s.audit.unshift({id:crypto.randomUUID(),date:new Date().toISOString(),actor,action,detail});}
function submitPayment(s,actor,data){if(!s.members.some(m=>m.id===actor))throw Error('forbidden');money(data.amount);if(!/^\d{4}-\d{2}-\d{2}$/.test(data.date)||data.date>today())throw Error('invalidDate');if(!['cash','momo','bank'].includes(data.method)||!['contribution','repayment'].includes(data.purpose))throw Error('invalidAmount');if(data.purpose==='repayment'){const l=s.loans.find(l=>l.id===data.loan&&l.member===actor&&l.status==='active');if(!l||data.amount>loanTotals(l).outstanding)throw Error('invalidLoan');}else if(!/^\d{4}-\d{2}$/.test(data.period||''))throw Error('invalidDate');const ref=(data.reference||'').trim();if(ref&&s.payments.some(p=>p.reference?.toLowerCase()===ref.toLowerCase()&&p.status!=='rejected'))throw Error('duplicate');const p={...data,reference:ref,id:crypto.randomUUID(),member:actor,status:'pending',submittedAt:new Date().toISOString()};s.payments.unshift(p);audit(s,actor,'submitted',p.id);return p;}
function reviewPayment(s,actor,id,decision,reason=''){if(s.members.find(m=>m.id===actor)?.role!=='treasurer')throw Error('forbidden');const p=s.payments.find(p=>p.id===id);if(!p||p.status!=='pending')throw Error('alreadyReviewed');if(!['approved','rejected'].includes(decision))throw Error('invalidAmount');if(decision==='rejected'&&!reason.trim())throw Error('reasonRequired');if(decision==='approved'){if(p.purpose==='repayment'){const l=s.loans.find(l=>l.id===p.loan&&l.member===p.member&&l.status==='active');if(!l||p.amount>loanTotals(l).outstanding)throw Error('invalidLoan');l.paid=(l.paid||0)+p.amount;if(loanTotals(l).outstanding===0)l.status='repaid';}s.ledger.unshift({id:crypto.randomUUID(),date:today(),kind:p.purpose==='repayment'?'repayment':'contribution',amount:p.amount,member:p.member,payment:p.id,loan:p.loan||null,detail:p.reference});}p.status=decision;p.reviewedBy=actor;p.reviewedAt=new Date().toISOString();p.reason=reason.trim();audit(s,actor,decision,p.id);}
function requestLoan(s,actor,data){if(!s.members.some(m=>m.id===actor))throw Error('forbidden');money(data.amount);if(!Number.isInteger(data.term)||data.term<1||data.term>s.settings.term)throw Error('invalidTerm');if(!data.purpose.trim())throw Error('reasonRequired');s.loans.unshift({...data,id:crypto.randomUUID(),member:actor,rate:s.settings.rate,status:'submitted',paid:0,createdAt:new Date().toISOString()});audit(s,actor,'loanRequested',String(data.amount));}
function reviewLoan(s,actor,id,decision,reason=''){if(s.members.find(m=>m.id===actor)?.role!=='chairperson')throw Error('forbidden');const l=s.loans.find(l=>l.id===id);if(!l||l.status!=='submitted')throw Error('alreadyReviewed');if(!['approved','rejected'].includes(decision))throw Error('invalidAmount');if(decision==='rejected'&&!reason.trim())throw Error('reasonRequired');l.status=decision;l.reviewedBy=actor;l.reviewedAt=new Date().toISOString();l.reason=reason;audit(s,actor,decision,id);}
function disburse(s,actor,id,reference){if(s.members.find(m=>m.id===actor)?.role!=='treasurer')throw Error('forbidden');const l=s.loans.find(l=>l.id===id);if(!l||l.status!=='approved')throw Error('alreadyReviewed');if(!reference.trim())throw Error('reasonRequired');if(l.amount>totals(s).cash)throw Error('insufficient');l.status='active';l.disbursedAt=today();s.ledger.unshift({id:crypto.randomUUID(),date:today(),kind:'disbursement',amount:l.amount,member:l.member,loan:l.id,detail:reference});audit(s,actor,'disbursed',id);}

const translations={en,rw,fr};

let state=seed(),lang='rw',actor='m1',filter='all',query='',storageError=false;
try{const raw=localStorage.getItem('ekimina-demo-v1');if(raw){const parsed=JSON.parse(raw);if(parsed.version!==1||!['members','payments','loans','ledger','audit'].every(k=>Array.isArray(parsed[k]))||!parsed.settings)throw Error();state=parsed;}lang=localStorage.getItem('ekimina-language')||'rw';if(!translations[lang])lang='rw';}catch{storageError=true;}
const app=document.querySelector('#app'),modal=document.querySelector('#modal');
const t=k=>translations[lang][k]||k;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat(lang==='fr'?'fr-RW':'en-RW').format(n);
const amount=n=>`${fmt(n)} <small>RWF</small>`;
const member=id=>state.members.find(m=>m.id===id)||{name:'—',role:'member'};
const me=()=>member(actor);
const initial=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('');
const treasurer=()=>me().role==='treasurer',leader=()=>me().role!=='member';
const paths={leaf:'M12 21v-9M12 16C3 16 3 9 3 5c7 0 9 4 9 7 0-7 4-10 10-10 0 8-3 12-10 12',overview:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',contributions:'M3 8h18v12H3zM3 8l3-5h12l3 5M3 12h18M16 16h2',loans:'M3 7h17M16 3l4 4-4 4M21 17H4M8 13l-4 4 4 4',members:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M16 3a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-3.87M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',reports:'M4 21V3h12l4 4v14zM8 16v-3M12 16V9M16 16v-5',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1z',plus:'M12 5v14M5 12h14',download:'M12 3v12M7 10l5 5 5-5M4 16v5h16v-5',bell:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4',chevron:'M9 5l7 7-7 7',arrow:'M4 12h16M15 7l5 5-5 5',shield:'M12 2l9 4v6c0 6-9 10-9 10S3 18 3 12V6zM8 12l3 3 5-6',menu:'M3 6h18M3 12h18M3 18h18',close:'M6 6l12 12M18 6L6 18',check:'M5 12l4 4L19 6',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 7v5l3 2',home:'M3 10l9-7 9 7v11H3zM9 21v-8h6v8'};
const icon=k=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[k]||paths.leaf}"/></svg>`;
const btn=(label,action,ico='',secondary=false,extra='')=>`<button type="button" class="btn ${secondary?'secondary':''}" data-action="${action}" ${extra}>${ico?icon(ico):''}${esc(t(label))}</button>`;
const language=()=>`<select aria-label="${esc(t('language'))}" data-language><option value="rw" ${lang==='rw'?'selected':''}>Kinyarwanda</option><option value="en" ${lang==='en'?'selected':''}>English</option><option value="fr" ${lang==='fr'?'selected':''}>Français</option></select>`;
const badge=s=>`<span class="badge ${s}">${esc(t(s))}</span>`;
const person=id=>`<div class="person"><span class="avatar">${esc(initial(member(id).name))}</span><div><strong>${esc(member(id).name)}</strong><small>${esc(t(member(id).role))}</small></div></div>`;
const visiblePayments=()=>state.payments.filter(p=>leader()||p.member===actor);
const visibleLoans=()=>state.loans.filter(l=>leader()||l.member===actor);
function mutate(fn,message){const next=structuredClone(state);try{fn(next);localStorage.setItem('ekimina-demo-v1',JSON.stringify(next));state=next;modal.close();render();toast(t(message));}catch(e){const msg=t(e.name==='QuotaExceededError'?'storageFail':e.message);const err=modal.open?modal.querySelector('.error'):null;if(err)err.textContent=msg;else toast(msg);}}
let toastTimer;function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',4500);}
function dialog(title,body,formId=''){modal.innerHTML=`<div class="dialog-head"><h2>${esc(t(title))}</h2><button class="icon-btn" data-action="close" aria-label="${esc(t('close'))}">${icon('close')}</button></div>${formId?`<form id="${formId}">`:''}${body}<div class="error" role="alert"></div>${formId?'</form>':''}`;modal.showModal();}
const formActions=(label='save')=>`<div class="form-actions">${btn('cancel','close','',true)}<button class="btn" type="submit">${esc(t(label))}</button></div>`;
const field=(key,name,type='text',value='',attrs='')=>`<label>${esc(t(key))}<input name="${name}" type="${type}" value="${esc(value)}" ${attrs}></label>`;
const selectField=(key,name,options)=>`<label>${esc(t(key))}<select class="field" name="${name}">${options}</select></label>`;
const option=(v,label,selected=false)=>`<option value="${esc(v)}" ${selected?'selected':''}>${esc(label)}</option>`;
const brand=()=>`<a class="brand" href="#home"><span class="mark">${icon('leaf')}</span>e-Kimina<span style="color:#96b87c">.</span></a>`;
function render(){document.documentElement.lang=lang;document.title=`e-Kimina · ${t('tagline')}`;const route=location.hash.slice(1)||'overview';if(route==='home'){landing();return;}const page=['overview','contributions','loans','members','reports','settings'].includes(route)?route:'overview';const count=totals(state).pending;app.innerHTML=`<div class="layout"><div class="mobile-shade" data-action="menu"></div><aside class="sidebar">${brand()}<div class="tagline">${esc(t('tagline'))}</div><div class="group-switch"><span class="group-logo">${icon('members')}</span><div><strong>${esc(state.settings.name)}</strong><span>${state.members.length} ${esc(t('members').toLowerCase())}</span></div></div><div class="nav-label">${esc(t('workspace'))}</div><nav class="nav">${['overview','contributions','loans','members','reports','settings'].map(k=>`<button data-route="${k}" class="${page===k?'active':''}" ${page===k?'aria-current="page"':''}>${icon(k)}${esc(t(k))}${k==='contributions'&&count&&treasurer()?`<span class="count">${count}</span>`:''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="help-box"><strong>${esc(t('help'))}</strong>${esc(t('helpText'))}<br><button data-action="help">${esc(t('guide'))} ↗</button></div><div class="profile"><span class="avatar">${esc(initial(me().name))}</span><div><strong>${esc(me().name)}</strong><small>${esc(t(me().role))}</small></div></div></div></aside><main class="workspace"><header class="topbar"><button class="icon-btn menu-toggle" data-action="menu" aria-label="Menu">${icon('menu')}</button><div class="breadcrumb">${esc(state.settings.name)} ${icon('chevron')} <span>${esc(t(page))}</span></div><div class="toolbar">${language()}<button class="icon-btn" data-action="notifications" aria-label="${esc(t('notifications'))}">${icon('bell')}<i class="dot"></i></button><span class="avatar">${esc(initial(me().name))}</span></div></header><div class="content"><div class="demo-bar"><span>${esc(t('demo'))}</span><label>${esc(t('demoRole'))}<select data-actor aria-label="${esc(t('demoRole'))}">${['m1','m2','m4','m5'].map(id=>option(id,t(member(id).role),actor===id)).join('')}</select></label></div>${storageError?`<div class="callout">${esc(t('loadError'))}</div>`:''}${({overview,contributions,loans:loansPage,members:membersPage,reports,settings}[page])()}<footer class="footer"><span>${icon('shield')}${esc(t('privacy'))}</span><span>© ${new Date().getFullYear()} e-Kimina · <a href="#home">${esc(t('backHome'))}</a> · ${esc(t('local'))}</span></footer></div></main></div>`;}
const heading=(title,sub,actions='',eyebrow='')=>`<div class="heading"><div>${eyebrow?`<div class="eyebrow">${esc(eyebrow)}</div>`:''}<h1>${esc(title)}</h1><p class="sub">${esc(t(sub))}</p></div><div class="actions">${actions}</div></div>`;
const stat=(title,value,ico,note,tag='')=>`<div class="stat"><div class="stat-top">${esc(t(title))}<span class="stat-icon">${icon(ico)}</span></div><strong>${value}</strong><div class="stat-foot">${tag?`<b>${esc(tag)}</b>`:''}${esc(t(note))}</div></div>`;
function overview(){const v=totals(state),progress=Math.min(100,Math.round(v.savings/state.settings.goal*100));const personal=state.ledger.filter(e=>e.kind==='contribution'&&e.member===actor).reduce((a,e)=>a+e.amount,0);return heading(me().role==='member'?t('memberDashboard'):`${t('welcome')} ${me().name.split(' ')[0]}.`,me().role==='member'?'memberDashboardSub':'welcomeSub',btn('export','export','download',true)+btn('record','payment','plus'),state.settings.name+' / '+t('overview'))+`<section class="hero"><div><div class="eyebrow">${esc(t('tagline'))}</div><h2>${esc(t('heroTitle'))}</h2><p>${esc(t('heroSub'))}</p></div><div class="hero-side"><div class="eyebrow">${esc(t('available'))}</div><strong>${fmt(v.cash)} <span style="font-size:12px">RWF</span></strong><small>${esc(t('confirmedOnly'))}</small></div></section><section class="stats">${stat(me().role==='member'?'personal':'savings',amount(me().role==='member'?personal:v.savings),'contributions','confirmedOnly')}${stat('outstanding',amount(me().role==='member'?visibleLoans().filter(l=>l.status==='active').reduce((a,l)=>a+loanTotals(l).outstanding,0):v.loans),'loans','includesInterest')}${stat('activeMembers',fmt(state.members.length),'members','membersOfGroup')}${stat('pendingPayments',visiblePayments().filter(p=>p.status==='pending').length,'clock','needsReview')}</section><div class="grid-main"><section class="panel"><div class="panel-head"><div><h2>${esc(t('savingsActivity'))}</h2><p class="sub">${esc(t('activitySub'))}</p></div><span class="badge active">RWF</span></div>${chart()}</section><section class="panel"><div class="panel-head"><div><h2>${esc(t('goal'))}</h2><p class="sub">${esc(t('goalSub'))}</p></div>${icon('leaf')}</div><div class="goal"><div class="goal-top"><div class="ring" style="--progress:${progress}%"><div>${progress}%<small>${esc(t('complete'))}</small></div></div><div><strong>${fmt(state.settings.goal)} RWF</strong><p>${esc(state.settings.name)}</p></div></div><div class="goal-row"><span>${esc(t('saved'))}</span><strong>${fmt(v.savings)} RWF</strong></div><div class="goal-row"><span>${esc(t('remaining'))}</span><strong>${fmt(Math.max(0,state.settings.goal-v.savings))} RWF</strong></div><div class="goal-note">${esc(t('goalNote'))}</div></div></section></div><div class="grid-main"><section class="panel"><div class="panel-head"><div><h2>${esc(t('recent'))}</h2><p class="sub">${esc(t('recentSub'))}</p></div><button class="btn ghost" data-route="contributions">${esc(t('viewAll'))} ${icon('arrow')}</button></div>${paymentTable(visiblePayments().slice(0,5),false)}<div class="panel-foot"><span>${visiblePayments().length} ${esc(t('contributions').toLowerCase())}</span><span>${esc(t('external'))}</span></div></section><section class="panel"><div class="panel-head"><h2>${esc(t('nextSteps'))}</h2></div>${[['reviewTitle','reviewText','review','contributions','contributions'],['loanTitle','loanText','openLoans','loans','loans'],['rulesTitle','rulesText','openSettings','settings','settings']].map(([a,b,c,r,i])=>`<div class="task"><span class="task-icon">${icon(i)}</span><div><strong>${esc(t(a))}</strong><p>${esc(t(b))}</p><button class="btn ghost" data-route="${r}">${esc(t(c))} →</button></div></div>`).join('')}</section></div>`;}
function chart(){const months=Array.from({length:6},(_,i)=>{const d=new Date(today()+'T12:00:00Z');d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()-5+i);return {period:d.toISOString().slice(0,7),label:new Intl.DateTimeFormat(lang==='rw'?'rw-RW':lang,{month:'short',timeZone:'Africa/Kigali'}).format(d)};});const target=state.settings.contribution*state.members.length;const values=months.map(m=>state.ledger.filter(e=>e.kind==='contribution'&&e.date.startsWith(m.period)).reduce((a,e)=>a+e.amount,0));const max=Math.max(target,...values,1);return `<div class="chart"><div class="chart-legend"><span>${esc(t('collected'))}</span><span>${esc(t('target'))}</span></div><div class="chart-area" role="img" aria-label="${esc(months.map((m,i)=>`${m.label}: ${values[i]} RWF; ${t('target')}: ${target} RWF`).join('. '))}"><div class="yaxis"><span>${fmt(max)}</span><span>${fmt(Math.round(max*.75))}</span><span>${fmt(Math.round(max*.5))}</span><span>${fmt(Math.round(max*.25))}</span><span>0</span></div><div class="bars">${months.map((m,i)=>`<div class="bar-group"><div class="bar" style="height:${values[i]/max*85}%" title="${esc(m.label)}: ${values[i]} RWF"></div><div class="bar light" style="height:${target/max*85}%"></div><span class="bar-label">${esc(m.label)}</span></div>`).join('')}</div></div></div>`;}
function paymentTable(list,action=true){return list.length?`<div class="table-wrap"><table><thead><tr>${['name','amount','method','status',...(action?['actions']:[])].map(k=>`<th>${esc(t(k))}</th>`).join('')}</tr></thead><tbody>${list.map(p=>`<tr><td>${person(p.member)}</td><td><span class="amount">${fmt(p.amount)} RWF</span><div class="statusline">${esc(t(p.purpose))} · ${esc(p.date)}</div></td><td>${esc(t(p.method))}<div class="statusline">${esc(p.reference||'—')}</div></td><td>${badge(p.status)}${p.reason?`<div class="statusline" style="white-space:normal;max-width:180px">${esc(p.reason)}</div>`:''}</td>${action?`<td>${treasurer()&&p.status==='pending'?btn('review','reviewPayment','',true,`data-id="${p.id}"`):`<button class="btn ghost" data-action="paymentDetail" data-id="${p.id}">${esc(t('detail'))}</button>`}</td>`:''}</tr>`).join('')}</tbody></table></div>`:`<div class="empty">${esc(t('noRecords'))}</div>`;}
function contributions(){const list=visiblePayments().filter(p=>(filter==='all'||p.status===filter)&&`${member(p.member).name} ${p.reference}`.toLowerCase().includes(query.toLowerCase()));return heading(t('contributions'),'paymentSub',btn('record','payment','plus'))+`<section class="panel"><div class="panel-head"><h2>${esc(t('recent'))}</h2><span class="badge pending">${visiblePayments().filter(p=>p.status==='pending').length} ${esc(t('reviewCount'))}</span></div><div class="tabs">${['all','pending','approved','rejected'].map(k=>`<button data-filter="${k}" class="${filter===k?'active':''}">${esc(t(k))}</button>`).join('')}</div><div class="filterbar"><input id="payment-search" value="${esc(query)}" placeholder="${esc(t('search'))}" aria-label="${esc(t('search'))}"></div><div id="payments-table">${paymentTable(list)}</div></section>`;}
function loansPage(){return heading(t('loans'),'loanSub',btn('requestLoan','loan','plus'))+`<div class="callout">${esc(t('loanInfo'))}</div><section class="panel"><div class="panel-head"><h2>${esc(t('loans'))}</h2><span class="muted" style="font-size:11px">${visibleLoans().length}</span></div><div class="table-wrap"><table><thead><tr>${['name','principal','interest','term','balance','status','actions'].map(k=>`<th>${esc(t(k))}</th>`).join('')}</tr></thead><tbody>${visibleLoans().map(l=>{const v=loanTotals(l);return `<tr><td>${person(l.member)}<div class="statusline">${esc(l.purpose)}</div></td><td class="amount">${fmt(l.amount)} RWF</td><td>${fmt(v.interest)} RWF<div class="statusline">${l.rate}% / ${esc(t('monthly'))}</div></td><td>${l.term} ${esc(t('months'))}</td><td>${['active','repaid'].includes(l.status)?fmt(v.outstanding)+' RWF':'—'}</td><td>${badge(l.status)}${l.status==='approved'?`<div class="statusline">${esc(t('approvedLoan'))}</div>`:''}</td><td>${l.status==='submitted'&&me().role==='chairperson'?btn('loanTitle','reviewLoan','',true,`data-id="${l.id}"`):l.status==='approved'&&treasurer()?btn('disburse','disburse','',false,`data-id="${l.id}"`):`<button class="btn ghost" data-action="loanDetail" data-id="${l.id}">${esc(t('detail'))}</button>`}</td></tr>`;}).join('')}</tbody></table></div></section>`;}
function membersPage(){return heading(t('members'),'membersSub',leader()?btn('addMember','addMember','plus'):'')+`<section class="panel"><div class="panel-head"><h2>${esc(state.settings.name)}</h2><span class="badge">${state.members.length} ${esc(t('members'))}</span></div><div class="table-wrap"><table><thead><tr>${['name',...(leader()?['phone']:[]),'role','status'].map(k=>`<th>${esc(t(k))}</th>`).join('')}</tr></thead><tbody>${state.members.map(m=>`<tr><td>${person(m.id)}</td>${leader()?`<td>${esc(m.phone)}</td>`:''}<td>${esc(t(m.role))}</td><td>${badge('active')}</td></tr>`).join('')}</tbody></table></div></section>`;}
function reports(){const entries=state.ledger.filter(e=>leader()||e.member===actor);return heading(t('reports'),'reportSub',btn('export','export','download'))+`<div class="report-tiles"><section class="panel report-tile">${icon('reports')}<h2>${esc(t('statement'))}</h2><p>${esc(t('statementText'))}</p>${btn('download','export','download',true)}</section><section class="panel report-tile">${icon('shield')}<h2>${esc(t('audit'))}</h2><p>${esc(t('auditText'))}</p><strong>${state.audit.filter(e=>leader()||e.actor===actor).length}</strong></section><section class="panel report-tile">${icon('contributions')}<h2>${esc(t('available'))}</h2><p>${esc(t('confirmedOnly'))}</p><strong>${fmt(totals(state).cash)} RWF</strong></section></div><section class="panel"><div class="panel-head"><h2>${esc(t('statement'))}</h2></div><div class="table-wrap"><table><thead><tr>${['date','name','event','amount'].map(k=>`<th>${esc(t(k))}</th>`).join('')}</tr></thead><tbody>${entries.map(e=>`<tr><td>${esc(e.date)}</td><td>${e.member?esc(member(e.member).name):esc(state.settings.name)}</td><td>${esc(e.kind==='opening'?t('goalNote'):t(e.kind==='disbursement'?'disbursedEvent':e.kind))}</td><td class="amount">${fmt(e.amount)} RWF</td></tr>`).join('')}</tbody></table></div></section><section class="panel" style="margin-top:22px"><div class="panel-head"><h2>${esc(t('auditTitle'))}</h2></div>${auditTable()}</section>`;}
const eventLabel=k=>({submitted:'submittedEvent',approved:'approvedEvent',rejected:'rejectedEvent',loanRequested:'loanRequested',disbursed:'disbursedEvent',settings:'settingsChanged',memberCreated:'memberCreated'}[k]||k);
function auditTable(){const list=state.audit.filter(e=>leader()||e.actor===actor);return list.length?`<div class="table-wrap"><table><thead><tr>${['date','actor','event','detail'].map(k=>`<th>${esc(t(k))}</th>`).join('')}</tr></thead><tbody>${list.slice(0,50).map(e=>`<tr><td>${esc(new Intl.DateTimeFormat(lang==='rw'?'rw-RW':lang,{dateStyle:'short',timeStyle:'short',timeZone:'Africa/Kigali'}).format(new Date(e.date)))}</td><td>${esc(member(e.actor).name)}</td><td>${esc(t(eventLabel(e.action)))}</td><td class="audit-detail">${esc(e.detail)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${esc(t('noRecords'))}</div>`;}
function settings(){const s=state.settings;return heading(t('settings'),'settingsSub')+`<div class="settings-grid"><section class="panel form-panel"><h2>${esc(t('settings'))}</h2><p class="sub" style="margin:10px 0 23px">${esc(t('settingsInfo'))}</p><form id="settings-form"><fieldset ${me().role!=='chairperson'?'disabled':''} style="border:0;padding:0;margin:0"><div class="form-grid">${field('groupName','name','text',s.name,'required maxlength="80"')}${field('contributionAmount','contribution','number',s.contribution,'required min="1" max="1000000000" step="1"')}${selectField('frequency','frequency',option('monthly',t('monthly'),s.frequency==='monthly'))}${field('rate','rate','number',s.rate,'required min="0" max="100" step="0.01"')}${field('maxTerm','term','number',s.term,'required min="1" max="60" step="1"')}${field('goalAmount','goal','number',s.goal,'required min="1" max="1000000000" step="1"')}</div>${me().role==='chairperson'?formActions():`<div class="callout">${esc(t('readOnly'))} · ${esc(t('chairperson'))}</div>`}</fieldset><div class="error" role="alert"></div></form></section><section class="panel form-panel" style="align-self:start"><h2>${esc(t('demoRole'))}</h2><p class="sub" style="margin:15px 0">${esc(t('howText')).replace(/\n/g,'<br>')}</p>${btn('reset','reset','',true)}</section></div>`;}
function landing(){app.innerHTML=`<div class="landing"><header class="landing-nav">${brand()}<div class="actions">${language()}${btn('tryDemo','openDemo','arrow')}</div></header><section class="landing-hero"><div><div class="eyebrow">${esc(t('builtFor'))}</div><h1>${esc(t('landingTitle')).split('\n').map((x,i)=>i?`<em>${x}</em>`:x).join('<br>')}</h1><p>${esc(t('landingText'))}</p><div class="actions" style="margin-top:28px">${btn('tryDemo','openDemo','arrow')}${btn('how','help','',true)}</div><p style="font-size:11px;margin-top:20px">${icon('shield')}${esc(t('external'))}</p></div><div class="landing-card"><div class="split">${icon('leaf')}<span>e-Kimina</span></div><div class="eyebrow" style="margin-top:35px">${esc(t('savings'))}</div><h2>${fmt(totals(state).savings)} <span style="font-size:15px">RWF</span></h2><p style="color:#cadac6;font-size:12px">${esc(state.settings.name)} · ${state.members.length} ${esc(t('members'))}</p><div class="landing-mini"><div class="split"><span>${esc(t('pendingPayments'))}</span><strong>${totals(state).pending}</strong></div><p>${esc(t('needsReview'))}</p></div><div class="statusline" style="color:#d2dfca;margin-top:20px">${esc(t('demoWarning'))}</div></div></section><section class="landing-features"><div><div class="eyebrow">e-Kimina</div><h1 style="font-size:28px">${esc(t('simple'))}</h1><div class="feature-grid">${['contributions','loans','members'].map((i,n)=>`<article class="feature">${icon(i)}<h2>${esc(t('feature'+(n+1)))}</h2><p>${esc(t('feature'+(n+1)+'Text'))}</p></article>`).join('')}</div></div></section><footer class="landing-bottom"><div class="split">${brand()}<span class="sub">Kinyarwanda · English · Français</span></div><p class="sub" style="margin-top:25px">${esc(t('demoWarning'))}</p></footer></div>`;}
function paymentDialog(){const active=state.loans.filter(l=>l.member===actor&&l.status==='active');dialog('record',`<p class="dialog-sub">${esc(t('paymentSub'))}</p><div class="form-grid">${field('amount','amount','number',state.settings.contribution,'required min="1" max="1000000000" step="1"')}${field('date','date','date',today(),`required max="${today()}"`)}${selectField('method','method',['momo','cash','bank'].map(k=>option(k,t(k))).join(''))}${selectField('purpose','purpose',option('contribution',t('contribution'))+(active.length?option('repayment',t('repayment')):''))}<div id="period-field">${field('period','period','month',today().slice(0,7),'required')}</div><div id="loan-field" hidden>${selectField('loan','loan',active.map(l=>option(l.id,`${fmt(loanTotals(l).outstanding)} RWF · ${l.purpose}`)).join(''))}</div><label class="full">${esc(t('reference'))} (${esc(t('optional'))})<input name="reference" maxlength="100"></label></div><div class="callout">${esc(t('paymentInfo'))}</div><p class="sub">${esc(t('receipt'))}</p>${formActions('send')}`,'payment-form');}
function loanDialog(){dialog('requestLoan',`<div class="form-grid">${field('amount','amount','number','100000','required min="1" max="1000000000" step="1"')}${field('term','term','number',state.settings.term,`required min="1" max="${state.settings.term}" step="1"`)}<label class="full">${esc(t('loanPurpose'))}<textarea name="purpose" required maxlength="300"></textarea></label></div><div class="callout">${esc(t('loanInfo'))}<br><strong>${state.settings.rate}% · ${esc(t('monthly'))}</strong></div>${formActions('requestLoan')}`,'loan-form');}
function reviewDialog(id,isLoan=false){const p=(isLoan?state.loans:state.payments).find(p=>p.id===id);if(!p)return;dialog(isLoan?'loanTitle':'reviewTitle',`<div class="dialog-sub">${person(p.member)}</div><h2>${fmt(p.amount)} RWF</h2><p class="sub">${esc(p.date||'')} · ${esc(p.reference||p.purpose)}</p><div class="callout">${esc(t(isLoan?'loanInfo':'reviewInfo'))}</div>${selectField('status','decision',['approved','rejected'].map(k=>option(k,t(k))).join(''))}<label style="margin-top:15px">${esc(t('reason'))}<textarea name="reason" maxlength="300"></textarea></label><input type="hidden" name="id" value="${p.id}">${formActions('confirm')}`,isLoan?'review-loan-form':'review-payment-form');}
app.addEventListener('input',e=>{if(e.target.id==='payment-search'){query=e.target.value;document.querySelector('#payments-table').innerHTML=paymentTable(visiblePayments().filter(p=>(filter==='all'||p.status===filter)&&`${member(p.member).name} ${p.reference}`.toLowerCase().includes(query.toLowerCase())));}});
document.addEventListener('change',e=>{if(e.target.matches('[data-language]')){lang=e.target.value;try{localStorage.setItem('ekimina-language',lang);}catch{}render();}if(e.target.matches('[data-actor]')){actor=e.target.value;filter='all';query='';render();}if(e.target.name==='purpose'&&e.target.closest('#payment-form')){const repay=e.target.value==='repayment';document.querySelector('#period-field').hidden=repay;document.querySelector('#period-field input').required=!repay;document.querySelector('#loan-field').hidden=!repay;}});
document.addEventListener('click',e=>{const target=e.target.closest('[data-action],[data-route],[data-filter]');if(!target)return;if(target.dataset.route){filter='all';query='';location.hash=target.dataset.route;return;}if(target.dataset.filter){filter=target.dataset.filter;render();return;}const id=target.dataset.id;switch(target.dataset.action){case 'openDemo':location.hash='overview';break;case 'menu':document.querySelector('.sidebar')?.classList.toggle('open');document.querySelector('.mobile-shade')?.classList.toggle('open');break;case 'close':modal.close();break;case 'help':dialog('howTitle',`<p style="font-size:13px;white-space:pre-line">${esc(t('howText'))}</p>${btn('close','close')}`);break;case 'notifications':dialog('notifications',`<p class="dialog-sub">${esc(t('notificationText'))}</p>${auditTable()}`);break;case 'payment':paymentDialog();break;case 'loan':loanDialog();break;case 'reviewPayment':reviewDialog(id);break;case 'reviewLoan':reviewDialog(id,true);break;case 'disburse':{const l=state.loans.find(l=>l.id===id);dialog('disburse',`<p class="dialog-sub">${esc(member(l.member).name)} · ${fmt(l.amount)} RWF</p><div class="callout">${esc(t('disburseInfo'))}</div>${field('reference','reference','text','','required maxlength="100"')}<input type="hidden" name="id" value="${id}">${formActions('disburse')}`,'disburse-form');break;}case 'addMember':dialog('addMember',`<div class="form-grid">${field('name','name','text','','required maxlength="80"')}${field('phone','phone','tel','','required maxlength="20" placeholder="07xx xxx xxx"')}</div><div class="callout">${esc(t('demo'))}</div>${formActions()}`,'member-form');break;case 'export':download();break;case 'reset':dialog('reset',`<p class="dialog-sub">${esc(t('resetInfo'))}</p>${formActions('reset')}`,'reset-form');break;case 'paymentDetail':{const p=state.payments.find(p=>p.id===id);dialog('confirmation',`${person(p.member)}<h2 style="margin-top:20px">${fmt(p.amount)} RWF</h2><p>${badge(p.status)}</p><p class="sub">${esc(p.date)} · ${esc(t(p.method))} · ${esc(p.reference||'—')}</p>${p.reviewedBy?`<div class="callout">${esc(t('approvedBy'))}: ${esc(member(p.reviewedBy).name)}<br>${esc(p.reviewedAt)}${p.reason?'<br>'+esc(p.reason):''}</div>`:''}${btn('close','close')}`);break;}case 'loanDetail':{const l=state.loans.find(l=>l.id===id),v=loanTotals(l);dialog('loans',`${person(l.member)}<p>${badge(l.status)}</p><p class="sub">${esc(l.purpose)}</p><div class="goal-row"><span>${esc(t('principal'))}</span><strong>${fmt(l.amount)} RWF</strong></div><div class="goal-row"><span>${esc(t('interest'))} · ${l.rate}% / ${esc(t('monthly'))}</span><strong>${fmt(v.interest)} RWF</strong></div><div class="goal-row"><span>${esc(t('totalDue'))}</span><strong>${fmt(v.total)} RWF</strong></div><div class="goal-row"><span>${esc(t('term'))}</span><strong>${l.term}</strong></div><div class="goal-row"><span>${esc(t('installment'))}</span><strong>~ ${fmt(Math.floor(v.total/l.term))} RWF</strong></div><div class="callout">${esc(t('scheduleInfo'))}</div>${l.reason?`<p>${esc(t('reason'))}: ${esc(l.reason)}</p>`:''}${btn('close','close')}`);break;}}});
document.addEventListener('submit',e=>{const f=e.target;if(!f.getAttribute('id'))return;e.preventDefault();const data=Object.fromEntries(new FormData(f));switch(f.getAttribute('id')){case 'payment-form':mutate(s=>submitPayment(s,actor,{...data,amount:Number(data.amount)}),'paymentSent');break;case 'loan-form':mutate(s=>requestLoan(s,actor,{...data,amount:Number(data.amount),term:Number(data.term)}),'loanSent');break;case 'review-payment-form':mutate(s=>reviewPayment(s,actor,data.id,data.decision,data.reason),'reviewed');break;case 'review-loan-form':mutate(s=>reviewLoan(s,actor,data.id,data.decision,data.reason),'loanApproved');break;case 'disburse-form':mutate(s=>disburse(s,actor,data.id,data.reference),'disbursed');break;case 'member-form':mutate(s=>{if(!leader())throw Error('forbidden');const phone=data.phone.replace(/[\s+()-]/g,'').replace(/^250/,'0');if(!/^07\d{8}$/.test(phone))throw Error('invalidPhone');if(s.members.some(m=>m.phone.replace(/\s/g,'')===phone))throw Error('duplicatePhone');if(!data.name.trim())throw Error('reasonRequired');s.members.push({id:crypto.randomUUID(),name:data.name.trim(),phone,role:'member'});audit(s,actor,'memberCreated',data.name.trim());},'memberAdded');break;case 'settings-form':{const err=f.querySelector('.error');try{mutate(s=>{if(me().role!=='chairperson')throw Error('forbidden');money(Number(data.contribution));money(Number(data.goal));const rate=Number(data.rate),term=Number(data.term);if(!data.name.trim()||rate<0||rate>100||!Number.isFinite(rate)||!Number.isInteger(term)||term<1||term>60)throw Error('invalidSettings');s.settings={name:data.name.trim(),contribution:Number(data.contribution),frequency:'monthly',rate,term,goal:Number(data.goal)};audit(s,actor,'settings',data.name);},'savedSettings');}catch(ex){err.textContent=t(ex.message);}break;}case 'reset-form':mutate(s=>Object.assign(s,seed()),'savedSettings');actor='m1';render();break;}});
function download(){const rows=[[t('date'),t('name'),t('event'),t('amount'),'RWF',t('reference')],...state.ledger.filter(e=>leader()||e.member===actor).map(e=>[e.date,e.member?member(e.member).name:state.settings.name,e.kind==='opening'?t('goalNote'):t(e.kind==='disbursement'?'disbursedEvent':e.kind),e.amount,'RWF',e.detail||''])];const safe=v=>{let val=String(v);if(/^[=+@\-\t\r]/.test(val))val="'"+val;return '"'+val.replace(/"/g,'""')+'"';};const blob=new Blob(['\uFEFF'+rows.map(r=>r.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`e-kimina-${today()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(t('exported'));}
window.addEventListener('hashchange',render);render();
</script><a href="https://github.com/gloire-kayla/e-kimina/tree/main/documentation" target="_blank" rel="noopener" style="position:fixed;bottom:12px;right:16px;z-index:60;background:#175948;color:white;padding:10px 14px;border-radius:8px;text-decoration:none;font:600 13px sans-serif">Documentation</a></body></html>
